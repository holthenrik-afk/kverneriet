# Publiserer nettstedet til GitHub Pages ved hvert push til main.
# Siden er ferdig bygget lokalt (python3 tools/build.py) – her kopieres bare filene, uten tools/ og README.
name: Publiser til GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Samle filene som skal ut
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude tools --exclude README.md --exclude .github --exclude .gitignore --exclude _redirects ./ /tmp/site/
      # På <bruker>.github.io/<repo>/ må rot-relative lenker få undermappen foran seg.
      # Med eget domene (kverneriet.com) er base_path tom og ingenting endres.
      - name: Tilpass lenker til base_path
        run: python3 tools/rebase.py "${{ steps.pages.outputs.base_path }}" /tmp/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
